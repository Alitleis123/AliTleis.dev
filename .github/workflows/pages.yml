name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # 07:00 UTC on the 1st of each month. The build bakes the "Now · <month>"
  # timeline marker and the copyright year into the static export, so without a
  # scheduled rebuild both freeze at the last push.
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The Resume repo syncs only the PDF, so the image of page one the
      # previews show is redrawn here, from the PDF this build ships.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Render resume preview
        run: |
          python -m pip install --quiet pymupdf==2.0 pillow==13.0.0
          python scripts/render-resume-preview.py

      - name: Build static site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
