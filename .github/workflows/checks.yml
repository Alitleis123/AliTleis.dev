name: Check pull request

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test backend
        run: node --test ask/test/*.test.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Render resume preview
        run: |
          python -m pip install --quiet pymupdf==2.0 pillow==13.0.0
          python scripts/render-resume-preview.py

      - name: Build static site
        run: npm run build
