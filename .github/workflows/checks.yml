name: Check pull request

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    # A throwaway Redis behind Upstash's REST API, so ask/test/redis.test.js
    # runs the panel's poll script for real.
    services:
      redis:
        image: redis:7-alpine
      srh:
        image: hiett/serverless-redis-http:0.0.10
        env:
          SRH_MODE: env
          SRH_TOKEN: test-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test backend
        env:
          TEST_REDIS_REST_URL: http://localhost:8079
          TEST_REDIS_REST_TOKEN: test-token
        run: node --test ask/test/*.test.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Render resume preview
        run: |
          python -m pip install --quiet pymupdf==2.0 pillow==13.0.0
          python scripts/render-resume-preview.py

      - name: Build static site
        run: npm run build
